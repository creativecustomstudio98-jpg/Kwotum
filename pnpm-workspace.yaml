packages:
  - apps/*
  - packages/*

allowBuilds:
  sharp: true
  unrs-resolver: true

blockExoticSubdeps: true
engineStrict: true
enableGlobalVirtualStore: false
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - nanoid@3.3.18
  - postcss@8.5.26
nodeVersion: 24.18.0
overrides:
  brace-expansion: 5.0.9
  js-yaml: 4.3.1
  nanoid: 3.3.18
  postcss: 8.5.26
  sharp: 0.35.3
  undici: 7.29.0
patchedDependencies:
  "@supabase/auth-js@2.110.8": patches/@supabase__auth-js@2.110.8.patch
  brace-expansion@5.0.9: patches/brace-expansion@5.0.9.patch
saveExact: true
strictPeerDependencies: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - eslint-import-resolver-typescript@3.10.1
  - semver@6.3.1
verifyDepsBeforeRun: error
