<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Potwierdź nowy adres e-mail w Kwotum</title>
  </head>
  <body
    style="
      margin: 0;
      background: #f7f6f1;
      color: #1a211e;
      font-family: Arial, Helvetica, sans-serif;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      border="0"
      style="background: #f7f6f1"
    >
      <tr>
        <td align="center" style="padding: 32px 16px">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            border="0"
            style="
              max-width: 600px;
              background: #ffffff;
              border: 1px solid #c9d0cb;
              border-radius: 12px;
            "
          >
            <tr>
              <td
                style="
                  padding: 24px 32px;
                  border-bottom: 1px solid #dce9e1;
                  color: #143d2f;
                  font-size: 22px;
                  font-weight: 700;
                  letter-spacing: -0.3px;
                "
              >
                Kwotum
              </td>
            </tr>
            <tr>
              <td style="padding: 36px 32px 32px">
                <main>
                  <p
                    style="
                      margin: 0 0 12px;
                      color: #2f6a4f;
                      font-size: 13px;
                      font-weight: 700;
                      letter-spacing: 0.08em;
                      text-transform: uppercase;
                    "
                  >
                    Bezpieczeństwo konta
                  </p>
                  <h1
                    style="
                      margin: 0 0 16px;
                      color: #1a211e;
                      font-size: 30px;
                      line-height: 1.2;
                      letter-spacing: -0.7px;
                    "
                  >
                    Potwierdź nowy adres e-mail
                  </h1>
                  <p style="margin: 0 0 24px; color: #46504b; font-size: 16px; line-height: 1.65">
                    Potwierdź zmianę adresu e-mail przypisanego do konta Kwotum.
                  </p>
                  <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                    <tr>
                      <td bgcolor="#143d2f" style="border-radius: 8px">
                        <a
                          href="{{ .ConfirmationURL }}"
                          style="
                            display: inline-block;
                            padding: 14px 22px;
                            color: #ffffff;
                            font-size: 16px;
                            font-weight: 700;
                            text-decoration: none;
                          "
                          >Potwierdź zmianę</a
                        >
                      </td>
                    </tr>
                  </table>
                  <p style="margin: 28px 0 0; color: #626b66; font-size: 14px; line-height: 1.6">
                    Jeśli nie zlecałeś tej zmiany, nie klikaj linku i niezwłocznie zmień hasło do
                    konta.
                  </p>
                </main>
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 20px 32px;
                  border-top: 1px solid #eff0eb;
                  color: #626b66;
                  font-size: 12px;
                  line-height: 1.6;
                "
              >
                Wiadomość dotycząca konta Kwotum · app.kwotum.pl
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
